[workspace]
resolver = "3"
members = ["crates/*"]
# The generated checker is a workspace of its own (generated/cpc-checker).
exclude = ["generated"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/daniel-larraz/pathos"

[workspace.lints.rust]
# pathos is meant to be memory safe: no unsafe code in its own crates.
unsafe_code = "forbid"

[workspace.lints.clippy]
# The methods listed in clippy.toml treat bytes 0x80 to 0xFF by Unicode
# rules, unlike Ethos; using one is an error, not a warning.
disallowed_methods = "deny"
