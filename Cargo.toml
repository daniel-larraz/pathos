[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/daniel-larraz/pathos"

[workspace.lints.rust]
# pathos is meant to be memory safe: no unsafe code in its own crates.
unsafe_code = "forbid"
