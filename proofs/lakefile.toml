name = "PathosProofs"
version = "0.1.0"
defaultTargets = ["MiniChecker", "MiniCases", "MiniCacheSem", "MiniProofs", "PathosProofs"]
# The generated files have Rust's names, not Mathlib's. (No `-j1` here: with
# it Lean needs more than 8 GiB for CPC's largest group of functions that
# call each other, and under 4 GiB without.)
weakLeanArgs = ["-Dweak.linter.style.nameCheck=false"]

# The revisions are those of pins.env; scripts/proofs-build checks that.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "1dc8ad31b1b062a77c50e29144a6c7bba955fa09"
subDir = "backends/lean"

[[require]]
name = "LogosVerification"
git = "https://github.com/cvc5/logos"
rev = "a9944ea7dcee950feb5e0d9b6271e83b421d206e"
subDir = "verification"

# Mathlib comes last, as Lake asks: logos and Aeneas's library each name a
# Mathlib of their own (v4.36.0, v4.36.0-rc2) and bring its dependencies,
# and the last requirement is the one whose versions are used.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

# The Lean that Charon and Aeneas write for generated/cpcmini-checker,
# stitched by scripts/aeneas-stitch. Generated: never edited.
[[lean_lib]]
name = "MiniChecker"

# The cases of CpcMini's programs, one function each, as the Rust tries
# them: written by lean-meta in the run that scripts/generate-mini makes.
# Generated: never edited.
[[lean_lib]]
name = "MiniCases"

# What the cache of program results holds, and the proofs about the
# generated functions: written by rust-meta with the crate. Generated: never
# edited.
[[lean_lib]]
name = "MiniCacheSem"

[[lean_lib]]
name = "MiniProofs"

[[lean_lib]]
name = "PathosProofs"
