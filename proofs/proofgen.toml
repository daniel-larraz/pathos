# What scripts/proofgen knows of logos's signature: the names of the
# checker's programs, constructors and types that the proofs of
# proofs/PathosProofs treat specially. A change to how logos defines its
# checker (a state-building program renamed or added, say) is a change
# here, not in Ethos and not in the generator.
#
# Each entry says which lemma of PathosProofs relies on it.

version = 1

[state]
# The checker's state: every argument of this type is assumed OK
# (`StateOK`, Runtime/StateInv.lean).
type = '($native_embed_checker "CState")'
# The tail of an OK state is OK (`StateOK.tail`).
cons = "$emb_s.cons"
# The empty and the stuck state are OK (`StateOK.nil`, `StateOK.stuck`).
ok_constants = ["$emb_s.nil", "$emb_s.Stuck"]
# The element that this program finds in an OK state has a formula that is
# not stuck, by this lemma (Runtime/StateNth.lean).
lookup = "$eo_state_proven_nth"
lookup_lemma = "state_proven_nth_ne_stuck_of"

# The programs that keep states OK (Runtime/StateInv.lean): the result is
# OK when the state arguments at these positions are.
[state.keeps]
"$eo_push_proven" = [1]
"$eo_invoke_cmd_check_proven" = [0]
"$eo_invoke_cmd_step_pop" = [1]
"$eo_invoke_cmd" = [0]
"$eo_invoke_cmd_list" = [0]
"$eo_invoke_assume_list" = [0]

[lists]
# The programs that eo::nil calls and that the lemma of eo::cons takes the
# spec of (Store.builtin_spec_cons, Runtime/Lists.lean).
nil = "$eo_nil"
is_nil = "$eo_is_list_nil"

[valid]
# The argument types whose `Valid` is `True` (Runtime/Embed.lean says why
# that is enough); terms and proofs have their own.
types = [
  '($native_type_0 "Bool")',
  '($native_type_0 "String")',
  '($native_type_0 "Nat")',
  '($native_embed_checker "CState")',
  '($native_embed_checker "CStateObj")',
  '($native_embed_checker "CArgList")',
  '($native_embed_checker "CCmdList")',
  '($native_embed_checker "CIndexList")',
  '$eo_Rule',
  '($native_embed_eo "Datatype")',
  '($native_embed_eo "DatatypeCons")',
  '($native_embed_eo "DatatypeDecl")',
  '$smt_Type',
  '($native_embed_smt "SmtDatatype")',
  '($native_embed_smt "SmtDatatypeCons")',
  '($native_embed_smt "SmtDatatypeDecl")',
  '$eo_Cmd',
  '$smt_Term',
  # CPC only (proofs-cpc/PathosProofsCpc/Valid.lean)
  '($native_embed_smt "SmtBindings")',
]

# The programs that rust-meta compiles to functions of the runtime, whose
# proofs are written by hand: the lemma, applied to what is proved of the
# programs it calls, and what it assumes of the arguments.

# The lookup with jump pointers (Runtime/StateNth.lean).
[hand.state_nth]
lemma = "state_proven_nth_spec"
good = ["StateOK", ""]

# The fold over the assumptions (Runtime/AssumeFold.lean), for this guard
# and push.
[hand.assume_fold]
lemma = "invoke_assume_list_spec"
guard_calls = ["$eo_is_bool_type", "$eo_is_closed"]
push = "$eo_push_input_assume_check"
good = ["StateOK", ""]

[parts]
# The parts of a large calculus's proofs (CpcProofs.Part<k>): each holds at
# most `programs` programs and `bytes` of their proofs' text, in program
# order. A part's memory grows with its size: Part5 held 40 programs in
# 631 KB and peaked at 7.9 GB, against the 8G cap of a local build and
# CI's 16 GB for two parts at once (2026-11-25). At 450,000 bytes Part6
# still reached 7.2 GB: some bit-vector rules weigh more per byte. A
# program larger than `bytes` goes over several parts, each importing the
# one before (2026-11-27; docs/proofs.md, "Long cases").
programs = 40
bytes = 350000

# Programs whose argument `arg` every call passes one of a few constants
# (each with its Lean term): their specs take `Pinned [...] x`
# (proofs-cpc/PathosProofsCpc/Pin.lean), each case is proved once for each
# constant, and the callers discharge it. A call that passes anything else
# makes scripts/proofgen fail. $re_ac_merge's operator is re.union or
# re.inter at each of $derivative's calls, and its list operators need a
# constant (CPC only).
[pinned."$re_ac_merge"]
arg = 0
ctors = { "re.union" = "Eo.Term.UOp Eo.UserOp.re_union", "re.inter" = "Eo.Term.UOp Eo.UserOp.re_inter" }

# $eo_mk_premise_list's operator is `and` at each of $eo_cmd_step_proven's
# calls, and eo::cons needs one that does not nest to the left; where none
# does (CpcMini), its spec needs no pin (left_nested).
[pinned."$eo_mk_premise_list"]
arg = 0
left_nested = true
ctors = { "and" = "Eo.Term.UOp Eo.UserOp.and" }

[heartbeats]
# The programs whose proofs take more than half the parts' 2,000,000
# heartbeats (PART_OPTIONS in scripts/proofgen): each of their theorems is
# elaborated under the limit here, and each such program has a part of its
# own. Measured again on 2026-11-27 (66e7c08, logos a6b896b5; 292f196
# generates the same text for these programs), after the long cases got
# cheaper (docs/proofs.md, "Long cases"): every theorem of each of the 38
# programs listed before, with `#count_heartbeats in` on its part alone
# (`lake lean`, with CpcProofs's -DmaxHeartbeats=2000000). The 27
# whose most was at most 1,000,000 have no entry now (the most of them
# 842,838, $eo_prog_str-replace-find-base); the others have about twice
# their most, rounded up to a million and at least 4,000,000, since CI
# takes more than a local build. The most of each in parentheses, its
# `rust_eq` or the spec of case 0.
"$eo_prog_bv-eq-extract-elim1" = 4000000  # (1,842,991)
"$eo_prog_bv-extract-concat-2" = 4000000  # (1,806,286)
"$eo_prog_str-update-in-first-concat" = 4000000  # (1,196,026)
"$eo_prog_bv-rotate-right-eliminate-1" = 4000000  # (1,190,609)
"$eo_prog_str-replace-all-find" = 4000000  # (1,176,605)
"$eo_prog_bv-extract-sign-extend-2" = 4000000  # (1,168,429)
"$eo_prog_str-replace-find-first-concat" = 4000000  # (1,163,404)
"$eo_prog_bv-sign-extend-ult-const-4" = 4000000  # (1,161,398)
"$eo_prog_bv-sign-extend-ult-const-1" = 4000000  # (1,121,733)
"$eo_prog_bv-sign-extend-ult-const-3" = 4000000  # (1,118,302)
"$eo_prog_bv-sign-extend-ult-const-2" = 4000000  # (1,060,157)
