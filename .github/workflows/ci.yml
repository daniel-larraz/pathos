# Checks on every push to main and every pull request:
#   - rust:        formatting, docs/panics.md against the commit it audits
#                  (scripts/check-panics), Clippy (warnings are errors),
#                  tests in debug and release builds
#   - regressions: pathos against the reference Ethos on Ethos's 230
#                  regressions, on the saved fuzzing findings (those from
#                  proofs are skipped: there is no corpus here), and on the
#                  command-line cases and the regressions under the --stats
#                  options, using the harness pinned in difftest.env
#
#   - eoc:         pathos-eoc against the reference ethos-eoc, through eoc's
#                  driver: every case of the Ethos test signatures (all the
#                  stages), and of logos's CPC the whole-signature cases
#                  (lean --all and the two desugar runs): 1,055 cases, two
#                  minutes on four local cores. The per-rule cases of CPC
#                  (2,452) are left to scripts/difftest eoc, run locally:
#                  the whole gate is about four times the work.
#
#   - platforms:   on each of the six platforms Ethos's own CI builds on
#                  (the same runners, GMP installed the same way): build
#                  and test pathos, build the reference Ethos there, and
#                  compare the two on the regressions, the command line,
#                  large-number arithmetic and the fuzzing findings; then
#                  scripts/platform-probe (line endings, file names, stack
#                  depths) and scripts/unsafe-reach. Release binaries are
#                  linked statically where Ethos's are (not on macOS) and
#                  uploaded on pushes to main. scripts/unsafe-reach (about
#                  ten minutes a platform) runs only when what it measures
#                  may have changed: Cargo.lock, a Cargo.toml, the source of
#                  the crates or of the generated CPC checker, the script
#                  or this file; and every week, for a new stable Rust, and on
#                  demand (input unsafe-reach).
#
# The cvc5 proof gates (proofs, large, options, perf) need a cvc5 build and
# up to 24 GB of memory, so they run locally with scripts/full-check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      unsafe-reach:
        description: Run scripts/unsafe-reach whatever changed
        type: boolean
        default: false
  # weekly, so that scripts/unsafe-reach sees each new stable Rust
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  # the weekly run and a push to main do not cancel each other
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # docs/panics.md against the commit it audits (not against this one:
      # a later change to the code does not fail this step).
      - name: The panic audit names real lines
        run: scripts/check-panics --fetch

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (debug)
        run: cargo test --locked

      - name: Tests (release)
        run: cargo test --locked --release

  # generated/cpc-checker and generated/cpcmini-checker are never edited by
  # hand: regenerate each from the Ethos and logos commits its GENERATED.md
  # names and compare.
  generated:
    name: The generated checkers are what Ethos's generator writes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the generator's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev

      - name: Regenerate generated/cpc-checker and compare
        run: scripts/generate-cpc --check --from-note

      # The same for the checker for CpcMini, which the proofs of proofs/
      # are about. It also compares the Lean the generator writes with
      # logos's CpcMini at the pinned revision.
      - name: Regenerate generated/cpcmini-checker and compare
        if: ${{ !cancelled() }}
        run: scripts/generate-mini --check --from-note

      - name: Keep the difference
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generate-cpc-difference
          path: |
            target/generate-cpc/check.diff
            target/generate-cpc/driver.log
            target/generate-mini/check.diff
            target/generate-mini/lean.diff
            target/generate-mini/driver.log
          if-no-files-found: ignore

  regressions:
    name: Agreement with Ethos on its regressions, the fuzzing findings and the command line
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins in difftest.env
        id: pins
        run: |
          source difftest.env
          echo "harness_repo=${HARNESS_REPO#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "harness_commit=$HARNESS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "reference_rev=$REFERENCE_REV" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.harness_repo }}
          ref: ${{ steps.pins.outputs.harness_commit }}
          path: ethos
          # build-ref needs the reference revision, an ancestor of the harness
          fetch-depth: 0

      - name: Install the reference's build dependencies and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev time

      - name: Cache the reference Ethos build
        uses: actions/cache@v6
        with:
          path: ethos/tools/difftest/work/ref
          key: ethos-ref-${{ steps.pins.outputs.reference_rev }}-ubuntu-24.04

      - name: Build the reference Ethos
        run: python3 ethos/tools/difftest/difftest.py build-ref ${{ steps.pins.outputs.reference_rev }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Compare pathos with Ethos
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos
        run: scripts/difftest tests --show-all --report difftest-report.json

      - name: Replay the fuzzing findings
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos
        run: scripts/difftest fuzz

      - name: Compare arithmetic on large numbers
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos
        run: scripts/difftest bignum --show-all --report difftest-bignum-report.json

      - name: Compare the command line and the statistics
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos
        run: scripts/difftest tests --cli --stats-option-sets --show-all --report difftest-cli-report.json

      - name: Keep the comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: difftest-report
          path: |
            difftest-report.json
            difftest-cli-report.json
            difftest-bignum-report.json
          if-no-files-found: ignore

  eoc:
    name: Agreement with ethos-eoc on the compiler stages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins in difftest.env
        id: pins
        run: |
          source difftest.env
          echo "harness_repo=${HARNESS_REPO#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "harness_commit=$HARNESS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "reference_rev=$REFERENCE_REV" >> "$GITHUB_OUTPUT"
          echo "logos_repo=$LOGOS_REPO" >> "$GITHUB_OUTPUT"
          echo "logos_rev=$LOGOS_REV" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.harness_repo }}
          ref: ${{ steps.pins.outputs.harness_commit }}
          path: ethos
          # build-ref needs the reference revision, an ancestor of the harness
          fetch-depth: 0

      - name: Check out logos where the harness looks for it
        run: |
          git clone --quiet "${{ steps.pins.outputs.logos_repo }}" ethos/tools/difftest/work/logos
          git -C ethos/tools/difftest/work/logos checkout --quiet "${{ steps.pins.outputs.logos_rev }}"

      - name: Install the reference's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev

      # The same directory as in the regressions job, here with ethos-eoc
      # built in it as well, so under a key of its own.
      - name: Cache the reference Ethos and ethos-eoc builds
        uses: actions/cache@v6
        with:
          path: ethos/tools/difftest/work/ref
          key: ethos-ref-eoc-${{ steps.pins.outputs.reference_rev }}-ubuntu-24.04

      - name: Build the reference Ethos and ethos-eoc
        run: python3 ethos/tools/difftest/difftest.py build-ref ${{ steps.pins.outputs.reference_rev }} --eoc

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Every case but the per-rule ones of logos's CPC.
      - name: Compare pathos-eoc with ethos-eoc
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos
        run: >-
          scripts/difftest eoc
          --filter '^eoc/(?!logos/)|^eoc/logos/(lean-all|desugar|desugar-eo)$'
          --show-all --report difftest-eoc-report.json

      - name: Keep the comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: difftest-eoc-report
          path: difftest-eoc-report.json
          if-no-files-found: ignore

  platforms:
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-arm64, macOS-x86_64, macOS-arm64, windows-x86_64, windows-arm64]
        include:
          # The runners, the shells and the GMP bottles are those of the
          # `build` job of Ethos's .github/workflows/main.yml at
          # REFERENCE_REV. crt-static is Ethos's --static: not on macOS.
          - name: linux-x86_64
            os: ubuntu-22.04
            shell: bash
            rustflags: -C target-feature=+crt-static
          - name: linux-arm64
            os: ubuntu-22.04-arm
            shell: bash
            rustflags: -C target-feature=+crt-static
          - name: macOS-x86_64
            os: macos-15-intel
            bottle-suffix: monterey
            gmp-sha256: b04023f65b8c79c45798a4bfd97fdbeb10f1bf9e8416e22e8eeedbd9b2a8c102
            shell: bash
            rustflags: ""
          - name: macOS-arm64
            os: macos-15
            bottle-suffix: arm64_monterey
            gmp-sha256: 2115b33b8b4052f91ffb85e476c7fc0388cf4e614af1ce6453b35e6d25473911
            shell: bash
            rustflags: ""
          - name: windows-x86_64
            os: windows-latest
            shell: 'msys2 {0}'
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-arm
            shell: 'msys2 {0}'
            rustflags: -C target-feature=+crt-static
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      ETHOS_HARNESS: ${{ github.workspace }}/ethos
    steps:
      # The cases are the bytes that are committed: no CRLF conversion on
      # Windows. scripts/platform-probe covers CRLF input.
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Read the pins in difftest.env
        id: pins
        shell: bash
        run: |
          source difftest.env
          echo "harness_repo=${HARNESS_REPO#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "harness_commit=$HARNESS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "reference_rev=$REFERENCE_REV" >> "$GITHUB_OUTPUT"
          echo "ref_dir=ethos/tools/difftest/work/ref/${REFERENCE_REV:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.harness_repo }}
          ref: ${{ steps.pins.outputs.harness_commit }}
          path: ethos
          # build-ref needs the reference revision, an ancestor of the harness
          fetch-depth: 0

      # The next five steps are Ethos's own, from its `build` job.
      - name: Set MACOSX_DEPLOYMENT_TARGET
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV

      - name: Install Packages (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_DEVELOPER: 1
        run: |
          GMP_BOTTLE=gmp-6.3.0.${{ matrix.bottle-suffix }}.bottle.tar.gz
          curl -L -H "Authorization: Bearer QQ==" -o $GMP_BOTTLE \
            https://ghcr.io/v2/homebrew/core/gmp/blobs/sha256:${{ matrix.gmp-sha256 }}
          brew reinstall -f $GMP_BOTTLE
          rm $GMP_BOTTLE

      - name: Install Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Install Packages (Windows x86_64)
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && runner.arch == 'X64'
        with:
          msystem: MINGW64
          path-type: inherit
          install: |
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp

      - name: Install Packages (Windows arm64)
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: |
            make
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-gmp

      # The platform's own toolchain: on Windows that is MSVC, the target
      # Rust supports best on both architectures (see README.md).
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build (release)
        run: cargo build --locked --release

      - name: Tests (debug)
        run: cargo test --locked --no-fail-fast

      - name: Tests (release)
        if: ${{ !cancelled() }}
        run: cargo test --locked --release --no-fail-fast

      - name: Cache the reference Ethos build
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ethos/tools/difftest/work/ref
          key: ethos-ref-${{ steps.pins.outputs.reference_rev }}-${{ steps.pins.outputs.harness_commit }}-${{ matrix.name }}

      - name: Build the reference Ethos
        if: ${{ !cancelled() }}
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" --version
          "$python" ethos/tools/difftest/difftest.py build-ref ${{ steps.pins.outputs.reference_rev }}

      - name: Compare pathos with Ethos on the regressions
        if: ${{ !cancelled() }}
        run: scripts/difftest tests --show-all --report difftest-report.json

      - name: Compare the command line and the statistics
        if: ${{ !cancelled() }}
        run: scripts/difftest tests --cli --stats-option-sets --show-all --report difftest-cli-report.json

      # Ethos's own CI checks out with the runner's settings, so on Windows
      # its regressions have CRLF line ends there. The same gate on such a
      # checkout of the harness, with the reference built above.
      - name: Check out the harness with CRLF line ends (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          git -c core.autocrlf=true clone --quiet ethos ethos-crlf
          git -C ethos-crlf -c core.autocrlf=true checkout --quiet ${{ steps.pins.outputs.harness_commit }}
          git -C ethos-crlf config core.autocrlf true
          mkdir -p ethos-crlf/tools/difftest/work
          cp -r ethos/tools/difftest/work/ref ethos-crlf/tools/difftest/work/ref
          file ethos-crlf/tests/simple.eo || true

      - name: Compare pathos with Ethos on the regressions with CRLF line ends (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          ETHOS_HARNESS: ${{ github.workspace }}/ethos-crlf
        run: scripts/difftest tests --show-all --report difftest-crlf-report.json

      - name: Compare arithmetic on large numbers
        if: ${{ !cancelled() }}
        run: scripts/difftest bignum --show-all --report difftest-bignum-report.json

      - name: Replay the fuzzing findings
        if: ${{ !cancelled() }}
        run: scripts/difftest fuzz

      - name: Compare what depends on the platform
        if: ${{ !cancelled() }}
        run: |
          python="$(command -v python3 || command -v python)"
          exe=""; [[ "$RUNNER_OS" == Windows ]] && exe=".exe"
          "$python" scripts/platform-probe \
            --ref "${{ steps.pins.outputs.ref_dir }}/build/src/ethos$exe" \
            --cand "target/release/pathos-eo$exe" --work target/platform-probe

      # scripts/unsafe-reach lists the dependency lines that pathos-eo,
      # pathos-eoc and pathos reach, so its output changes only with
      # Cargo.lock, a Cargo.toml, the source of the crates or of the
      # generated CPC checker, the toolchain (the weekly run), the script
      # or this file. Compared with main for a run on demand, with the base for a
      # pull request, and with the previous commit of main for a push; if
      # the comparison fails or lists 300 files (GitHub's cap), it runs.
      - name: Decide whether to list the dependency code
        id: reach
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.unsafe-reach }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          case "$EVENT" in
            schedule) run=true ;;
            workflow_dispatch) [[ "$FORCE" == true ]] && run=true; base=main ;;
            pull_request) base="$PR_BASE" ;;
            *) base="$BEFORE" ;;
          esac
          if [[ "$run" == false ]]; then
            if files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.files[].filename')"; then
              if [[ "$(grep -c . <<< "$files")" -ge 300 ]] ||
                grep -qE '^(Cargo\.(lock|toml)|crates/|generated/cpc-checker/|scripts/unsafe-reach$|\.github/workflows/ci\.yml$|rust-toolchain|\.cargo/)' <<< "$files"; then
                run=true
              fi
            else
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "scripts/unsafe-reach: $run ($EVENT)"

      # LLVM's addr2line on Linux: binutils 2.38's, on these runners, is far
      # slower on pathos's debug information. scripts/unsafe-reach finds a
      # versioned one (llvm-addr2line-<n>) by itself.
      - name: Find LLVM's addr2line (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.reach.outputs.run == 'true' }}
        run: |
          if ! ls /usr/bin/llvm-addr2line* /usr/lib/llvm-*/bin/llvm-addr2line > /dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y llvm
          fi
          ls /usr/bin/llvm-addr2line* /usr/lib/llvm-*/bin/llvm-addr2line 2>/dev/null || true

      # LLVM's tools where binutils cannot read the binaries: Homebrew's on
      # macOS, and on Windows those of MSYS2 or of the runner's LLVM.
      - name: Find a disassembler (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.reach.outputs.run == 'true' }}
        run: |
          dir="$(ls -d /opt/homebrew/opt/llvm*/bin /usr/local/opt/llvm*/bin 2>/dev/null | sort | tail -1 || true)"
          if [[ -z "$dir" || ! -x "$dir/llvm-addr2line" ]]; then
            brew install llvm
            dir="$(brew --prefix llvm)/bin"
          fi
          echo "OBJDUMP=$dir/llvm-objdump" >> $GITHUB_ENV
          echo "ADDR2LINE=$dir/llvm-addr2line" >> $GITHUB_ENV

      - name: Find a disassembler (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.reach.outputs.run == 'true' }}
        run: |
          pacman -S --needed --noconfirm "${MINGW_PACKAGE_PREFIX}-llvm-tools" ||
            pacman -S --needed --noconfirm "${MINGW_PACKAGE_PREFIX}-llvm" || true
          for dir in "$MINGW_PREFIX/bin" "/c/Program Files/LLVM/bin"; do
            if [[ -x "$dir/llvm-objdump.exe" && -x "$dir/llvm-addr2line.exe" ]]; then
              echo "OBJDUMP=$(cygpath -m "$dir")/llvm-objdump.exe" >> $GITHUB_ENV
              echo "ADDR2LINE=$(cygpath -m "$dir")/llvm-addr2line.exe" >> $GITHUB_ENV
              break
            fi
          done

      - name: List the dependency code in the binaries
        if: ${{ !cancelled() && steps.reach.outputs.run == 'true' }}
        run: scripts/unsafe-reach

      - name: Keep the comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: difftest-report-${{ matrix.name }}
          path: |
            difftest-report.json
            difftest-cli-report.json
            difftest-bignum-report.json
            difftest-crlf-report.json
          if-no-files-found: ignore

      # As Ethos does: the release binary of each platform, with the licences.
      - name: Prepare the binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/package artifact

      - name: Upload the binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pathos-${{ matrix.name }}
          path: artifact/*
