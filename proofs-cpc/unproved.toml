# The programs of CPC whose generated proof does not build, with why
# (scripts/proofgen --unproved, which scripts/generate-cpc passes): proofgen
# writes no proof of them, nor of what calls them, and proofs.tsv gives the
# reason. Each is a gap in the generator or the library to close later
# (stage 5, milestone 4; docs/proofs.md). Written by hand, from the build's
# errors.

"$eo_prog_arrays_read_over_write_contra" = "the spec of case 0: simp fails (a nested error)"
"$eo_prog_quant-miniscope-and" = "the spec of case 0: leaves goals unsolved"
"$eo_prog_str-indexof-eq-irr" = "the spec of case 0: simp fails (a nested error)"
"$eo_prog_str-repl-repl-lookahead-id-simp" = "the spec of case 0: simp fails (a nested error)"
"$eo_to_smt_tuple_prepend_of_type" = "the spec of case 0: simp makes no progress"
"$eo_to_smt_tuple_select" = "the spec of case 0: simp makes no progress"
"$eo_to_smt_type" = "the spec of case 13: simp makes no progress"
"$eo_to_smt_type_tuple" = "the spec of case 0: simp makes no progress"
"$eo_typeof_+" = "the spec of case 0: a rewrite finds no occurrence of its pattern"
"$eo_typeof_/" = "the spec of case 0: a rewrite finds no occurrence of its pattern"
"$eo_typeof_<" = "the spec of case 0: a rewrite finds no occurrence of its pattern"
"$eo_typeof_abs" = "the spec of case 0: a rewrite finds no occurrence of its pattern"
"$smtx_dt_num_sels" = "the spec of step: leaves goals unsolved"
"$dt_updater_elim_rhs" = "a variable repeated as an operator's index itself (update's), which may be the stuck term: logos's __eo_eq of two stuck terms is stuck, the case form's equality is true, so logos_eq_deep cannot prove the two equal"
"$is_absorb_rec" = "falls through to two helpers (__eo_l_1, __eo_l_2); logos_eq_deep leaves goals unsolved"
"$is_eq_maybe_to_real" = "falls through to a helper; logos_eq_deep fails (simp, a nested error)"
"$is_renaming_rec" = "a repeated variable; logos_eq_deep leaves goals unsolved"
"$tuple_updater_elim_rhs" = "a variable repeated as an operator's index itself (tuple.select's), which may be the stuck term (see $dt_updater_elim_rhs); logos_eq_deep also times out (whnf)"
