# The programs of CPC whose generated proof does not build, with why
# (scripts/proofgen --unproved, which scripts/generate-cpc passes): proofgen
# writes no proof of them, nor of what calls them, and proofs.tsv gives the
# reason. Each is a gap in the generator or the library to close later
# (stage 5, milestone 4; docs/proofs.md). Written by hand, from the build's
# errors.

