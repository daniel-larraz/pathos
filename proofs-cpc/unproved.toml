# The programs of CPC whose generated proof does not build, with why
# (scripts/proofgen --unproved, which scripts/generate-cpc passes): proofgen
# writes no proof of them, nor of what calls them, and proofs.tsv gives the
# reason. Each is a gap in the generator or the library to close later
# (stage 5, milestone 4; docs/proofs.md). Written by hand, from the build's
# errors.

"$eo_prog_bv-rotate-left-eliminate-1" = "the spec of case 0: times out (whnf, 2,000,000 heartbeats) and simp exceeds its steps; logos_eq does not prove the case form (binary literals, milestone 6)"
"$bv_div_mod_impl" = "the spec of case 2: times out (whnf, 2,000,000 heartbeats); at 20,000,000 its part runs out of 8G of memory (with $arith_reduction_pred, 11 min)"
"$arith_reduction_pred" = "the spec of case 7: times out (whnf, 2,000,000 heartbeats); at 20,000,000 its part runs out of 8G of memory (with $bv_div_mod_impl, 11 min)"
"$eo_prog_bv-smod-eliminate" = "the spec of case 0: times out (whnf, 2,000,000 heartbeats); at 20,000,000 it runs out of 8G of memory (13 min)"
